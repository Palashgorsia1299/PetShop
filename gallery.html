<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Car Gallery</title>

    <link rel="stylesheet" href="../css/task.css">
</head>

<body>

    <div class="galleryPage">

        <h1 class="galleryTitle">Car Gallery</h1>

        <p class="galleryIntro">
            Explore some of our favorite cars.
        </p>


        <div class="galleryGrid">

            <div class="galleryItem">
                <img
                    src="https://hips.hearstapps.com/hmg-prod/images/2025-audi-rs7-125-67f68b49cafa4.jpg?crop=0.574xw:0.430xh;0.213xw,0.358xh&resize=1200:*"
                    alt="Audi RS7">
                <h2>Audi</h2>
            </div>


            <div class="galleryItem">
                <img
                    src="https://hips.hearstapps.com/mtg-prod/6751df8bd2f4c10008f7b608/009-2025-mini-cooper-s-4-door.jpg?w=768&width=768&q=75&format=webp"
                    alt="Mini Cooper">
                <h2>Mini Cooper</h2>
            </div>


            <div class="galleryItem">
                <img
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTjcFivGCBrjScbJ6WjoUiWFkskIf1VDazIoobDYFqaf8iSGIXGi1TQyXPP&s=10"
                    alt="Range Rover">
                <h2>Range Rover</h2>
            </div>


            <div class="galleryItem">
                <img
                    src="https://stimg.cardekho.com/images/carexteriorimages/930x620/Land-Rover/Defender/9080/1755764417900/front-left-side-47.jpg"
                    alt="Land Rover Defender">
                <h2>Land Rover Defender</h2>
            </div>


            <div class="galleryItem">
                <img
                    src="https://images.unsplash.com/photo-1542282088-72c9c27ed0cd?auto=format&fit=crop&w=800&q=80"
                    alt="Sports Car">
                <h2>Sports Car</h2>
            </div>


            <div class="galleryItem">
                <img
                    src="https://images.unsplash.com/photo-1503736334956-4c8f8e92946d?auto=format&fit=crop&w=800&q=80"
                    alt="Luxury Car">
                <h2>Luxury Car</h2>
            </div>

        </div>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>

    <link rel="stylesheet" href="../css/task.css">
</head>

<body>

    <div class="contactPage">

        <h1 class="contactTitle">Contact Us</h1>

        <p class="contactIntro">
            If you have any questions or suggestions, feel free to
            get in touch with us.
        </p>


        <div class="contactContainer">

            <!-- Contact Information -->

            <div class="contactInfo">

                <h2 class="contactHeading">Get In Touch</h2>

                <p>
                    We would love to hear from you. You can contact us
                    using the information given below.
                </p>

                <p>
                    <strong>Email:</strong>
                    cardemo@gmail.com
                </p>

                <p>
                    <strong>Phone:</strong>
                    +91 98765 43210
                </p>

                <p>
                    <strong>Address:</strong>
                    Nagpur, Maharashtra, India
                </p>

            </div>


            <!-- Contact Form -->

            <div class="contactForm">

                <h2 class="contactHeading">Send Us A Message</h2>

                <form>

                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                    >

                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >

                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        rows="5"
                        placeholder="Enter your message"
                    ></textarea>

                    <button type="submit">
                        Submit
                    </button>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
